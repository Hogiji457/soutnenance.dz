<style>
/* ============ Design tokens — deep cosmic glassmorphism ============ */
:root {
  --font-sans: "Readex Pro", ui-sans-serif, system-ui, sans-serif;
  --font-display: "Syne", "Readex Pro", ui-sans-serif, sans-serif;
  --font-mono: "JetBrains Mono", "Readex Pro", ui-monospace, monospace;

  --background: oklch(0.095 0.02 300);          /* #05030a */
  --foreground: oklch(0.965 0.012 300);
  --muted-foreground: oklch(0.72 0.035 295);
  --primary-foreground: oklch(0.99 0.005 300);
  --secondary: oklch(0.2 0.04 295 / 0.6);
  --destructive: oklch(0.65 0.22 22);
  --neon: oklch(0.68 0.26 302);
  --neon-blue: oklch(0.76 0.16 228);
  --neon-pink: oklch(0.7 0.24 340);
  --gold: oklch(0.84 0.14 82);
  --gold-foreground: oklch(0.18 0.04 70);
  --glass: oklch(0.15 0.035 295 / 0.45);
  --glass-border: oklch(0.558 0.252 302 / 0.3);  /* rgba(147, 51, 234, 0.3) */
  --whatsapp: oklch(0.74 0.17 152);

  --gradient-neon: linear-gradient(120deg, var(--neon) 0%, var(--neon-blue) 100%);
  --gradient-text: linear-gradient(100deg, oklch(0.97 0.01 300) 0%, oklch(0.82 0.14 302) 45%, var(--neon-blue) 100%);
  --gradient-gold: linear-gradient(120deg, oklch(0.92 0.1 90) 0%, var(--gold) 45%, oklch(0.7 0.15 60) 100%);
  --shadow-neon: 0 0 0 1px oklch(0.62 0.25 302 / 0.5), 0 10px 40px -8px oklch(0.62 0.25 302 / 0.65), 0 0 80px -20px oklch(0.76 0.16 228 / 0.6);
  --shadow-gold: 0 0 0 1px oklch(0.84 0.14 82 / 0.55), 0 16px 60px -12px oklch(0.84 0.14 82 / 0.45);
  --shadow-card: 0 20px 60px -30px oklch(0 0 0 / 0.9), inset 0 1px 0 oklch(1 0 0 / 0.06);
  --ease: cubic-bezier(0.2, 0.8, 0.2, 1);
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; border-color: var(--glass-border); }
html { scroll-behavior: smooth; color-scheme: dark; }
body {
  background: var(--background);
  color: var(--foreground);
  font-family: var(--font-sans);
  -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
  line-height: 1.5;
}
::selection { background: oklch(0.62 0.25 302 / 0.45); }
a { color: inherit; text-decoration: none; }
button { font: inherit; color: inherit; background: none; border: 0; }
ul { list-style: none; }
svg.i { width: 1em; height: 1em; flex-shrink: 0; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
svg.wa { width: 1.25em; height: 1.25em; flex-shrink: 0; fill: currentColor; }

.container { width: 100%; max-width: 72rem; margin-inline: auto; padding-inline: 1.25rem; }
@media (min-width: 640px) { .container { padding-inline: 1.5rem; } }

.font-display { font-family: var(--font-display); }
.font-mono { font-family: var(--font-mono); }
.muted { color: var(--muted-foreground); }
.text-gradient { background: var(--gradient-text); -webkit-background-clip: text; background-clip: text; color: transparent; }
.text-gold { background: var(--gradient-gold); -webkit-background-clip: text; background-clip: text; color: transparent; }
.eyebrow { font-family: var(--font-mono); font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.22em; color: var(--neon-blue); }

/* Arabic script must stay connected: no decorative letter-spacing in RTL. */
[dir="rtl"] .font-display, [dir="rtl"] .eyebrow, [dir="rtl"] .tracking { letter-spacing: 0 !important; }
[dir="rtl"] h1 { line-height: 1.35 !important; }

/* ============ Background ============ */
.bg-layer { position: fixed; inset: 0; z-index: -1; pointer-events: none; }
.cosmic-mesh {
  position: absolute; inset: -10%;
  background:
    radial-gradient(40rem 30rem at 15% 10%, oklch(0.45 0.22 302 / 0.35), transparent 70%),
    radial-gradient(35rem 28rem at 85% 20%, oklch(0.55 0.16 235 / 0.28), transparent 70%),
    radial-gradient(45rem 35rem at 50% 85%, oklch(0.4 0.2 290 / 0.25), transparent 70%),
    radial-gradient(30rem 25rem at 90% 75%, oklch(0.5 0.18 228 / 0.18), transparent 70%);
  animation: mesh-drift 22s ease-in-out infinite alternate;
}
.grid-lines {
  position: absolute; inset: 0;
  background-image: linear-gradient(oklch(1 0 0 / 0.035) 1px, transparent 1px), linear-gradient(90deg, oklch(1 0 0 / 0.035) 1px, transparent 1px);
  background-size: 64px 64px;
  -webkit-mask-image: radial-gradient(ellipse at 50% 30%, black 20%, transparent 75%);
  mask-image: radial-gradient(ellipse at 50% 30%, black 20%, transparent 75%);
}

/* ============ Glass surfaces ============ */
.glass { background: var(--glass); border: 1px solid var(--glass-border); backdrop-filter: blur(16px) saturate(140%); -webkit-backdrop-filter: blur(16px) saturate(140%); box-shadow: var(--shadow-card); }
.glass-strong { background: oklch(0.13 0.035 295 / 0.72); border: 1px solid var(--glass-border); backdrop-filter: blur(20px) saturate(160%); -webkit-backdrop-filter: blur(20px) saturate(160%); box-shadow: var(--shadow-card); }

/* Interactive card: pointer spotlight + tactile lift */
.card { position: relative; isolation: isolate; border-radius: 1.75rem; transition: transform .35s var(--ease), box-shadow .35s ease, border-color .35s ease; }
.card::before {
  content: ""; position: absolute; inset: 0; border-radius: inherit; z-index: -1; opacity: 0; transition: opacity .4s ease;
  background: radial-gradient(22rem circle at var(--mx, 50%) var(--my, 50%), oklch(0.62 0.25 302 / 0.2), transparent 60%);
}
.card:hover { transform: translateY(-4px) scale(1.015); border-color: oklch(0.68 0.26 302 / 0.65); box-shadow: var(--shadow-neon); }
.card:hover::before { opacity: 1; }
.card:active { transform: scale(0.99); }

/* Scroll reveal */
.reveal { opacity: 0; transform: translateY(28px); filter: blur(6px); transition: opacity .9s var(--ease), transform .9s var(--ease), filter .9s ease; transition-delay: var(--d, 0ms); }
.reveal.visible { opacity: 1; transform: none; filter: none; }

/* ============ Buttons ============ */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: .5rem; border-radius: 999px; white-space: nowrap; cursor: pointer; transition: all .3s ease; font-weight: 500; }
.btn-xl { height: 3.5rem; padding-inline: 2rem; font-size: 1rem; }
.btn-sm { height: 2.25rem; padding-inline: 1rem; font-size: .875rem; }
.btn-md { height: 2.75rem; padding-inline: 1.25rem; font-size: .9rem; }
.btn-neon { background: var(--gradient-neon); color: var(--primary-foreground); font-weight: 600; box-shadow: var(--shadow-neon); }
.btn-neon:hover { transform: scale(1.04); filter: brightness(1.1); }
.btn-glass { background: var(--glass); border: 1px solid var(--glass-border); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); }
.btn-glass:hover { transform: scale(1.03); border-color: oklch(0.68 0.26 302 / 0.7); box-shadow: var(--shadow-neon); }
.btn-gold { background: var(--gradient-gold); color: var(--gold-foreground); font-weight: 600; box-shadow: var(--shadow-gold); }
.btn-gold:hover { transform: scale(1.04); filter: brightness(1.1); }
.btn:active { transform: scale(0.97); }
.w-full { width: 100%; }

/* ============ Header ============ */
.header { position: fixed; inset-inline: 0; top: .75rem; z-index: 50; padding-inline: .75rem; }
.header-inner { max-width: 72rem; margin-inline: auto; display: flex; align-items: center; justify-content: space-between; gap: .75rem; border-radius: 999px; padding: .625rem 1rem; transition: all .5s ease; }
.header.scrolled .header-inner { background: oklch(0.13 0.035 295 / 0.72); box-shadow: var(--shadow-neon); }
.brand { display: flex; align-items: center; gap: .5rem; font-family: var(--font-display); font-weight: 700; font-size: 1rem; letter-spacing: -0.01em; }
.brand .cap { display: inline-block; transition: transform .3s ease; }
.brand:hover .cap { transform: rotate(-12deg) scale(1.25); }
.nav { display: none; gap: .25rem; }
.nav a { border-radius: 999px; padding: .5rem 1rem; font-size: .875rem; color: var(--muted-foreground); transition: all .2s ease; }
.nav a:hover { background: var(--secondary); color: var(--foreground); }
@media (min-width: 640px) { .header { top: 1.25rem; padding-inline: 1.5rem; } .header-inner { padding-inline: 1.5rem; } .brand { font-size: 1.125rem; } }
@media (min-width: 768px) { .nav { display: flex; } }

.lang-switch { position: relative; display: grid; grid-template-columns: repeat(3, 1fr); border-radius: 999px; border: 1px solid var(--glass-border); background: oklch(0.095 0.02 300 / 0.5); padding: .25rem; font-family: var(--font-mono); font-size: .75rem; font-weight: 600; }
.lang-pill { position: absolute; top: .25rem; bottom: .25rem; left: .25rem; width: calc((100% - .5rem) / 3); border-radius: 999px; background: var(--gradient-neon); box-shadow: var(--shadow-neon); transition: transform .5s var(--ease); }
.lang-switch button { position: relative; z-index: 1; width: 2.75rem; padding-block: .375rem; border-radius: 999px; text-transform: uppercase; cursor: pointer; color: var(--muted-foreground); transition: color .3s ease; }
.lang-switch button:hover { color: var(--foreground); }
.lang-switch button[aria-pressed="true"] { color: var(--primary-foreground); }

/* ============ Hero ============ */
.hero { position: relative; display: flex; align-items: center; min-height: 100svh; padding-top: 7rem; padding-bottom: 4rem; }
.hero-grid { display: grid; align-items: center; gap: 1.5rem; }
.hero-text { text-align: center; }
.pill-eyebrow { display: inline-flex; align-items: center; gap: .5rem; border-radius: 999px; padding: .375rem 1rem; font-family: var(--font-mono); font-size: 10px; text-transform: uppercase; letter-spacing: .1em; color: var(--muted-foreground); }
.ping { position: relative; display: flex; width: .5rem; height: .5rem; }
.ping::before, .ping::after { content: ""; position: absolute; inset: 0; border-radius: 999px; background: var(--neon-blue); }
.ping::before { animation: ping 1s cubic-bezier(0, 0, 0.2, 1) infinite; opacity: .7; }
h1 { margin-top: 1.5rem; font-family: var(--font-display); font-size: 2.15rem; font-weight: 700; line-height: 1.08; letter-spacing: -0.02em; }
.hero-sub { max-width: 36rem; margin: 1.5rem auto 0; font-size: 1rem; line-height: 1.7; color: var(--muted-foreground); }
.hero-ctas { margin-top: 2.25rem; display: flex; flex-direction: column; align-items: center; gap: .75rem; }
.hero-ctas .btn { width: 100%; }
.badges { margin-top: 2rem; display: flex; flex-wrap: wrap; justify-content: center; gap: .5rem 1.25rem; font-size: .875rem; color: var(--muted-foreground); }
.badges li { display: flex; align-items: center; gap: .375rem; }
.badges svg { color: var(--neon-blue); font-size: 1rem; }
.orb-col { position: relative; margin-inline: auto; width: 100%; max-width: 340px; }
.float-tag { position: absolute; display: none; border-radius: 1rem; padding: .625rem 1rem; font-size: .75rem; animation: float 7s ease-in-out infinite; }
.float-tag.t1 { inset-inline-start: 0; top: 14%; }
.float-tag.t2 { inset-inline-end: 0; bottom: 12%; animation-delay: -3.5s; }
@media (min-width: 640px) {
  .pill-eyebrow { font-size: .75rem; letter-spacing: .18em; }
  h1 { font-size: 3rem; }
  .hero-sub { font-size: 1.125rem; }
  .hero-ctas { flex-direction: row; justify-content: center; }
  .hero-ctas .btn { width: auto; }
  .orb-col { max-width: 460px; }
  .float-tag { display: block; }
  .hero { padding-top: 8rem; }
}
@media (min-width: 1024px) {
  .hero-grid { grid-template-columns: 1.1fr .9fr; gap: 2.5rem; }
  .hero-text { text-align: start; }
  .hero-sub { margin-inline: 0; }
  .hero-ctas, .badges { justify-content: flex-start; }
  h1 { font-size: 3.6rem; }
  .orb-col { max-width: 560px; }
}

/* Energy orb */
.orb { position: relative; aspect-ratio: 1; width: 100%; }
.orb > * { position: absolute; border-radius: 999px; }
.orb .core { inset: 28%; background: var(--gradient-neon); opacity: .7; filter: blur(64px); animation: pulse-glow 4.5s ease-in-out infinite; }
.orb .core2 { inset: 38%; background: oklch(0.76 0.16 228 / 0.4); filter: blur(40px); animation: float 7s ease-in-out infinite; }
.orb .halo { inset: 12%; border: 1px solid oklch(0.68 0.26 302 / 0.2); animation: spin 24s linear infinite; }
.orb .halo span { position: absolute; top: -4px; left: 50%; width: .5rem; height: .5rem; transform: translateX(-50%); border-radius: 999px; background: var(--neon-blue); box-shadow: var(--shadow-neon); }
.orb .dash { inset: 4%; border: 1px dashed oklch(0.76 0.16 228 / 0.1); }
.orb canvas { inset: 0; border-radius: 0; }

/* ============ Sections ============ */
section.block { position: relative; scroll-margin-top: 7rem; padding-block: 5rem; }
@media (min-width: 640px) { section.block { padding-block: 7rem; } }
.h2 { font-family: var(--font-display); font-size: 1.875rem; font-weight: 700; line-height: 1.2; }
@media (min-width: 640px) { .h2 { font-size: 2.25rem; } }
@media (min-width: 1024px) { .h2 { font-size: 3rem; } }
.center { text-align: center; margin-inline: auto; }

.why-grid { margin-top: 3rem; display: grid; gap: 1rem; }
@media (min-width: 640px) { .why-grid { grid-template-columns: repeat(2, 1fr); } }
@media (min-width: 1024px) { .why-grid { grid-template-columns: repeat(4, 1fr); } }
.why-card { height: 100%; padding: 1.5rem; }
.icon-box { display: flex; align-items: center; justify-content: center; width: 3rem; height: 3rem; border-radius: 1rem; border: 1px solid var(--glass-border); background: oklch(0.68 0.26 302 / 0.1); color: var(--neon-blue); font-size: 1.5rem; }
.icon-box.solid { border: 0; background: var(--gradient-neon); color: var(--primary-foreground); box-shadow: var(--shadow-neon); flex-shrink: 0; }
.card h3 { margin-top: 1.25rem; font-family: var(--font-display); font-size: 1.125rem; font-weight: 600; }
.card p.desc { margin-top: .5rem; font-size: .875rem; line-height: 1.65; color: var(--muted-foreground); }

/* Trial */
.trial-box { position: relative; overflow: hidden; border-radius: 2rem; padding: 1.5rem; }
.blob { position: absolute; width: 20rem; height: 20rem; border-radius: 999px; filter: blur(64px); }
.blob.b1 { top: -8rem; inset-inline-end: -6rem; background: oklch(0.68 0.26 302 / 0.3); }
.blob.b2 { bottom: -8rem; inset-inline-start: -6rem; background: oklch(0.76 0.16 228 / 0.2); }
.trial-grid { position: relative; display: grid; align-items: center; gap: 2.5rem; }
.trial-text { text-align: center; }
.chip { display: inline-flex; align-items: center; gap: .5rem; border-radius: 999px; border: 1px solid oklch(0.76 0.16 228 / 0.4); background: oklch(0.76 0.16 228 / 0.1); padding: .25rem .75rem; font-family: var(--font-mono); font-size: .75rem; text-transform: uppercase; letter-spacing: .18em; color: var(--neon-blue); }
.trial-text .h2 { margin-top: 1.25rem; }
.trial-text p.sub { margin-top: 1rem; color: var(--muted-foreground); }
.trial-text p.note { margin-top: 1.5rem; font-family: var(--font-mono); font-size: .75rem; color: var(--muted-foreground); }
.trial-cards { display: grid; gap: 1rem; }
.trial-card { display: flex; flex-direction: column; height: 100%; padding: 1.5rem; }
.trial-card .lbl { display: flex; align-items: center; gap: .5rem; font-size: .875rem; color: var(--muted-foreground); }
.trial-card .lbl svg { color: var(--neon); }
.trial-card .big { margin-top: 1rem; display: flex; align-items: baseline; gap: .75rem; }
.trial-card .num { font-family: var(--font-display); font-size: 4.5rem; font-weight: 700; line-height: 1; }
.trial-card .free { font-family: var(--font-display); font-size: 1.125rem; font-weight: 600; }
.trial-card .btn { margin-top: 1.5rem; }
@media (min-width: 640px) { .trial-box { padding: 2.5rem; } .trial-cards { grid-template-columns: repeat(2, 1fr); } .trial-text p.sub { font-size: 1.125rem; } }
@media (min-width: 1024px) { .trial-box { padding: 3.5rem; } .trial-grid { grid-template-columns: 1fr 1.15fr; } .trial-text { text-align: start; } }

/* Services */
.services-head { max-width: 42rem; }
.services-head .h2 { margin-top: 1rem; }
.services-head p { margin-top: 1rem; color: var(--muted-foreground); }
@media (min-width: 640px) { .services-head p { font-size: 1.125rem; } }
.svc-grid { margin-top: 3.5rem; display: grid; gap: 1.25rem; }
@media (min-width: 768px) {
  .svc-grid { grid-template-columns: repeat(2, 1fr); }
  .svc-grid .tall { grid-row: span 2; }
  .svc-grid .wide { grid-column: span 2; }
}
.svc-grid > .reveal { height: 100%; }
.svc-card { display: flex; flex-direction: column; height: 100%; padding: 1.5rem; }
@media (min-width: 640px) { .svc-card { padding: 2rem; } .svc-card h3 { font-size: 1.5rem !important; } .svc-card p.desc { font-size: 1rem !important; } }
.svc-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 1rem; }
.svc-card h3 { font-size: 1.25rem !important; margin-top: 1.5rem !important; }
.svc-bottom { margin-top: auto; }
.price { margin-top: 1.5rem; font-family: var(--font-display); font-size: 1.875rem; font-weight: 700; letter-spacing: -0.02em; }
.price .unit { font-size: 1rem; font-weight: 500; color: var(--muted-foreground); -webkit-text-fill-color: var(--muted-foreground); }
.crit { margin-top: .25rem; font-size: .875rem; color: var(--neon-blue); }
.tiers { margin-top: 1.5rem; display: grid; grid-template-columns: repeat(2, 1fr); gap: .625rem; }
@media (min-width: 640px) { .tiers { grid-template-columns: repeat(3, 1fr); } }
.tier { border-radius: 1rem; border: 1px solid var(--glass-border); background: oklch(0.095 0.02 300 / 0.4); padding: .75rem; text-align: center; transition: all .3s ease; }
.tier:hover { transform: translateY(-2px); border-color: oklch(0.76 0.16 228 / 0.6); background: oklch(0.76 0.16 228 / 0.1); }
.tier .d { font-family: var(--font-mono); font-size: .75rem; color: var(--muted-foreground); }
.tier .p { margin-top: .25rem; font-family: var(--font-display); font-size: 1.125rem; font-weight: 700; }

/* Golden bundle */
.bundle-wrap { margin-top: 1.25rem; }
.bundle { position: relative; border-radius: 2rem; background: var(--gradient-gold); padding: 1px; box-shadow: var(--shadow-gold); transition: transform .5s ease; }
.bundle:hover { transform: scale(1.01); }
.bundle:active { transform: scale(0.99); }
.bundle-inner { position: relative; overflow: hidden; border-radius: calc(2rem - 1px); padding: 1.5rem; }
.bundle-inner .glow { position: absolute; top: -6rem; inset-inline-end: 0; width: 18rem; height: 18rem; border-radius: 999px; background: oklch(0.84 0.14 82 / 0.2); filter: blur(64px); }
.bundle-grid { position: relative; display: grid; align-items: center; gap: 2rem; }
.gold-badge { display: inline-flex; align-items: center; gap: .5rem; border-radius: 999px; background: var(--gradient-gold); padding: .25rem .75rem; font-family: var(--font-mono); font-size: .75rem; font-weight: 600; text-transform: uppercase; letter-spacing: .16em; color: var(--gold-foreground); }
.bundle h3 { margin-top: 1.25rem; font-family: var(--font-display); font-size: 1.875rem; font-weight: 700; }
.bundle .tagline { margin-top: .5rem; font-family: var(--font-display); font-size: 1.125rem; color: oklch(0.965 0.012 300 / 0.9); }
.bundle .bdesc { margin-top: .75rem; color: var(--muted-foreground); }
.includes { margin-top: 1.5rem; display: grid; gap: .625rem; }
.includes li { display: flex; align-items: center; gap: .5rem; font-size: .875rem; }
.includes .tick { display: flex; align-items: center; justify-content: center; width: 1.25rem; height: 1.25rem; border-radius: 999px; background: oklch(0.84 0.14 82 / 0.15); color: var(--gold); font-size: .875rem; flex-shrink: 0; }
.bundle-price { border-radius: 1.5rem; border: 1px solid oklch(0.84 0.14 82 / 0.3); background: oklch(0.095 0.02 300 / 0.4); padding: 1.5rem; text-align: center; }
.save { display: inline-flex; align-items: center; gap: .375rem; border-radius: 999px; border: 1px solid oklch(0.84 0.14 82 / 0.4); padding: .25rem .75rem; font-size: .75rem; color: var(--gold); }
.bundle-price .amount { margin-top: 1rem; white-space: nowrap; font-family: var(--font-display); font-size: 3rem; font-weight: 700; line-height: 1; }
.bundle-price .btn { margin-top: 1.5rem; }
@media (min-width: 640px) { .bundle-inner { padding: 2.5rem; } .bundle h3 { font-size: 2.25rem; } .includes { grid-template-columns: repeat(3, 1fr); } .bundle-price .amount { font-size: 3.75rem; } }
@media (min-width: 1024px) { .bundle-grid { grid-template-columns: 1.3fr 1fr; } }

/* ============ Footer ============ */

/* Scroll reveal */
let revealObserver = null;
function observeReveals() {
  if (revealObserver) revealObserver.disconnect();
  const els = document.querySelectorAll(".reveal:not(.visible)");
  if (!("IntersectionObserver" in window)) { els.forEach((e) => e.classList.add("visible")); return; }
  revealObserver = new IntersectionObserver((entries) => {
    entries.forEach((en) => { if (en.isIntersecting) { en.target.classList.add("visible"); revealObserver.unobserve(en.target); } });
  }, { threshold: 0.12, rootMargin: "0px 0px -6% 0px" });
  els.forEach((e) => revealObserver.observe(e));
}

/* Pointer spotlight on cards */
document.addEventListener("pointermove", (e) => {
  const card = e.target.closest && e.target.closest(".card");
  if (!card) return;
  const r = card.getBoundingClientRect();
  card.style.setProperty("--mx", `${e.clientX - r.left}px`);
  card.style.setProperty("--my", `${e.clientY - r.top}px`);
}, { passive: true });

function setLang(lang, save) {
  const t = DICT[lang];
  document.documentElement.lang = lang;
  document.documentElement.dir = lang === "ar" ? "rtl" : "ltr";
  document.querySelectorAll("#lang-switch button").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.lang === lang)));
  document.getElementById("lang-pill").style.transform = `translateX(${LANGS.indexOf(lang) * 100}%)`;
  renderNav(t);
  renderHero(t);
  document.getElementById("sections").innerHTML = renderWhy(t) + renderTrial(t) + renderServices(t, lang);
  renderFooter(t);
  const fab = document.getElementById("fab");
  fab.href = whatsappLink(t.wa.general);
  fab.setAttribute("aria-label", t.hero.cta);
  fab.innerHTML = WA_ICON;
  observeReveals();
  if (save) { try { localStorage.setItem(STORAGE_KEY, lang); } catch (_) {} }
}

document.querySelectorAll("#lang-switch button").forEach((b) => b.addEventListener("click", () => setLang(b.dataset.lang, true)));

/* Header glass intensifies on scroll */
const header = document.getElementById("header");
const onScroll = () => header.classList.toggle("scrolled", window.scrollY > 24);
window.addEventListener("scroll", onScroll, { passive: true });
onScroll();

let initial = DEFAULT_LANG;
try { const saved = localStorage.getItem(STORAGE_KEY); if (LANGS.includes(saved)) initial = saved; } catch (_) {}
setLang(initial, false);

/* ===================== Energy orb: liquid particle sphere ===================== */
(function energyOrb() {
  const wrap = document.getElementById("orb");
  const canvas = document.getElementById("orb-canvas");
  const ctx = canvas.getContext("2d");
  if (!ctx) return;
  const css = getComputedStyle(document.documentElement);
  const palette = [
    css.getPropertyValue("--neon").trim() || "#a855f7",
    css.getPropertyValue("--neon-blue").trim() || "#38bdf8",
    css.getPropertyValue("--neon-pink").trim() || "#ec4899",
  ];
  const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  const small = window.innerWidth < 768;
  const SPHERE = small ? 900 : 1600;
  const RING = small ? 260 : 420;
  const pts = [];
  const golden = Math.PI * (3 - Math.sqrt(5));
  for (let i = 0; i < SPHERE; i++) {
    const y = 1 - (i / (SPHERE - 1)) * 2, r = Math.sqrt(1 - y * y), th = golden * i;
    pts.push({ x: Math.cos(th) * r, y, z: Math.sin(th) * r, c: i % 7 === 0 ? 2 : y > 0 ? 0 : 1, s: Math.random(), ring: false, a: th });
  }
  for (let i = 0; i < RING; i++) {
    const a = (i / RING) * Math.PI * 2, rad = 1.45 + (Math.random() - 0.5) * 0.12;
    pts.push({ x: Math.cos(a) * rad, y: (Math.random() - 0.5) * 0.04, z: Math.sin(a) * rad, c: 1, s: Math.random(), ring: true, a });
  }

  let w = 0, h = 0, dpr = 1;
  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    const rect = wrap.getBoundingClientRect();
    w = rect.width; h = rect.height;
    canvas.width = Math.round(w * dpr); canvas.height = Math.round(h * dpr);
    canvas.style.width = w + "px"; canvas.style.height = h + "px";
  }
  resize();
  new ResizeObserver(resize).observe(wrap);

  const pointer = { x: 0, y: 0, tx: 0, ty: 0 };
  window.addEventListener("pointermove", (e) => {
    pointer.tx = (e.clientX / window.innerWidth - 0.5) * 2;
    pointer.ty = (e.clientY / window.innerHeight - 0.5) * 2;
  }, { passive: true });

  let running = true, looping = true, raf = 0;
  new IntersectionObserver(([e]) => {
    running = !!(e && e.isIntersecting);
    if (running && !looping && !reduceMotion) { looping = true; raf = requestAnimationFrame(frame); }
  }).observe(wrap);

  const start = performance.now();
  const buckets = [[], [], []];
  const proj = new Float32Array(pts.length * 3);

  function frame(now) {
    const t = (now - start) / 1000;
    pointer.x += (pointer.tx - pointer.x) * 0.04;
    pointer.y += (pointer.ty - pointer.y) * 0.04;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, w, h);
    ctx.globalCompositeOperation = "lighter";
    const R = Math.min(w, h) * 0.3, cx = w / 2, cy = h / 2;
    const rotY = t * 0.22 + pointer.x * 0.6, rotX = -0.35 + pointer.y * 0.4;
    const cyR = Math.cos(rotY), syR = Math.sin(rotY), cxR = Math.cos(rotX), sxR = Math.sin(rotX);
    const ct = Math.cos(0.42), st = Math.sin(0.42);
    buckets.forEach((b) => (b.length = 0));
    for (let i = 0; i < pts.length; i++) {
      const p = pts[i];
      let x = p.x, y = p.y, z = p.z;
      if (p.ring) {
        const a = p.a + t * 0.35, rad = Math.hypot(p.x, p.z);
        x = Math.cos(a) * rad; z = Math.sin(a) * rad;
        const y2 = y * ct - z * st; z = y * st + z * ct; y = y2;
      } else {
        const wave = 1 + 0.07 * Math.sin(3 * p.y + t * 1.6) * Math.cos(2.5 * p.a + t * 0.9) + 0.04 * Math.sin(5 * p.x + t * 2.2);
        x *= wave; y *= wave; z *= wave;
      }
      const x1 = x * cyR - z * syR, z1 = x * syR + z * cyR;
      const y1 = y * cxR - z1 * sxR, z2 = y * sxR + z1 * cxR;
      const persp = 2.6 / (2.6 + z2);
      proj[i * 3] = cx + x1 * R * persp;
      proj[i * 3 + 1] = cy + y1 * R * persp;
      proj[i * 3 + 2] = z2;
      buckets[p.c].push(i);
    }
    buckets.forEach((list, b) => {
      ctx.fillStyle = palette[b];
      for (const i of list) {
        const pt = pts[i], z = proj[i * 3 + 2], depth = (1 - z) / 2;
        const twinkle = 0.6 + 0.4 * Math.sin(t * 2 + pt.s * 20);
        ctx.globalAlpha = (0.15 + depth * 0.75) * twinkle;
        const size = (pt.ring ? 1.1 : 0.7 + depth * 1.6) * (small ? 0.9 : 1);
        ctx.beginPath(); ctx.arc(proj[i * 3], proj[i * 3 + 1], size, 0, Math.PI * 2); ctx.fill();
      }
    });
    ctx.globalAlpha = 1;
    if (running && !reduceMotion) raf = requestAnimationFrame(frame); else looping = false;
  }
  raf = requestAnimationFrame(frame);
})();
